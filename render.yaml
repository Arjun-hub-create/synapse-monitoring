services:
  - type: web
    name: synapse-monitoring
    env: python
    pythonVersion: 3.11
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: MONGODB_URL
        value: ${MONGODB_URL}
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: RENDER_SERVICE_ID
        value: ${RENDER_SERVICE_ID}
